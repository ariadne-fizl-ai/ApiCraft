[workspace]
resolver = "2"
members = ["crates/core", "crates/agent", "crates/ui-egui", "apps/desktop", "apps/web", "xtask"]
default-members = ["crates/core", "crates/agent", "crates/ui-egui", "apps/desktop"]

[workspace.package]
version = "0.1.2"
edition = "2021"
license = "Apache-2.0"
authors = ["Fizl Ltd", "Simon Soanes"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
egui = "0.37"
eframe = { version = "0.37", default-features = false }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
