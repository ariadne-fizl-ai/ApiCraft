# Serves the browser build (see the Dockerfile at the repository root).
server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Pre-compressed by the image build; nothing is compressed per request.
    gzip_static on;
    gzip_vary on;

    # The file names aren't content-hashed, so browsers revalidate them (ETag)
    # on each load and only download what changed.
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    # As the agent sends: requests may go anywhere, the page itself can't be framed.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src * http: https: ws: wss:; frame-ancestors 'none'" always;

    location / {
        try_files $uri $uri/ =404;
    }
}
